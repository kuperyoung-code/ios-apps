<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Apps</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 30px 18px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #6e6e73;
      margin-bottom: 30px;
    }

    .app {
      background: white;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }

    .icon {
      width: 70px;
      height: 70px;
      border-radius: 16px;
      background: linear-gradient(135deg,#111,#555);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 30px;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
    }

    .info h2 {
      margin: 0 0 5px;
      font-size: 19px;
    }

    .info p {
      margin: 0;
      color: #86868b;
      font-size: 14px;
    }

    .install {
      display: inline-block;
      margin-top: 10px;
      background: #007aff;
      color: white;
      text-decoration: none;
      padding: 8px 17px;
      border-radius: 18px;
      font-weight: 600;
      font-size: 14px;
    }

    .notice {
      margin-top: 30px;
      color: #86868b;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>iOS Apps</h1>
  <div class="subtitle">Каталог приложений для iPhone и iPad</div>

  <div class="app">

    <div class="icon">A</div>

    <div class="info">
      <h2>Тестовое приложение</h2>
      <p>Тест каталога и системы установки</p>

      <a class="install" href="#">
        Установить
      </a>
    </div>

  </div>

  <div class="notice">
    Перед установкой ознакомьтесь с инструкцией.
  </div>

</div>

</body>
</html>
